<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GITT - Login</title>

    <link rel="stylesheet" href="index.css">

</head>


<body>

    <div class="login-container">

        <div class="login-box">

            <div class="logo">
                GITT
            </div>

            <h1>Welcome Back</h1>

            <p class="subtitle">
                Login to explore cloud platforms
            </p>


            <form onsubmit="login(event)">

                <div class="input-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter your username"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button type="submit">
                    Login
                </button>

            </form>


            <p class="login-info">
                Explore AWS, GCP and Microsoft Azure
            </p>

        </div>

    </div>


    <script src="login.js"></script>

</body>

</html>
